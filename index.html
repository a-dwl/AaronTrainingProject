<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nederlands Leren — Dutch Study App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F5F2ED;
    --surface: #FDFCFA;
    --surface2: #EDE9E2;
    --border: rgba(60,50,30,0.12);
    --border2: rgba(60,50,30,0.22);
    --text: #1A1612;
    --text2: #6B6055;
    --text3: #A09488;
    --accent: #D4522A;
    --accent-light: #FAE9E3;
    --green: #2A7A50;
    --green-light: #E3F2EA;
    --red: #B83232;
    --red-light: #FAE3E3;
    --blue: #1E5FA6;
    --blue-light: #E3EEFA;
    --card-h: 240px;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    padding: 1.5rem 2rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: baseline;
    gap: 1rem;
  }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.6rem;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  header span {
    font-size: 0.8rem;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.06em;
  }

  .app {
    position: relative;
    z-index: 1;
    flex: 1;
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 0;
  }

  /* SIDEBAR */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 1.5rem 0;
    overflow-y: auto;
  }

  .sidebar-section {
    margin-bottom: 0.25rem;
  }

  .sidebar-label {
    font-size: 0.67rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
    padding: 0.5rem 1.25rem 0.25rem;
  }

  .mode-btn {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    width: 100%;
    padding: 0.55rem 1.25rem;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.88rem;
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    text-align: left;
    transition: all 0.15s;
    border-left: 2px solid transparent;
  }

  .mode-btn:hover { background: var(--surface2); color: var(--text); }
  .mode-btn.active { color: var(--accent); background: var(--accent-light); border-left-color: var(--accent); font-weight: 500; }

  .mode-icon { font-size: 1rem; width: 18px; text-align: center; }

  .cat-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 0.45rem 1.25rem;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.82rem;
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    text-align: left;
    transition: all 0.15s;
    border-left: 2px solid transparent;
  }

  .cat-btn:hover { background: var(--surface2); color: var(--text); }
  .cat-btn.active { color: var(--accent); background: var(--accent-light); border-left-color: var(--accent); font-weight: 500; }

  .cat-count {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--text3);
    background: var(--surface2);
    padding: 1px 6px;
    border-radius: 10px;
  }

  .cat-btn.active .cat-count { background: rgba(212,82,42,0.15); color: var(--accent); }

  /* MAIN AREA */
  .main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .toolbar {
    padding: 1rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--surface);
  }

  .toolbar-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.1rem;
    flex: 1;
  }

  .toolbar-btn {
    padding: 0.4rem 0.9rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text2);
    font-size: 0.8rem;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
  }

  .toolbar-btn:hover { background: var(--surface2); color: var(--text); }
  .toolbar-btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .toolbar-btn.primary:hover { background: #b8421f; border-color: #b8421f; }

  /* PROGRESS BAR */
  .progress-wrap {
    height: 3px;
    background: var(--surface2);
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.4s ease;
  }

  .study-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    gap: 1.5rem;
    overflow-y: auto;
  }

  .stats-row {
    display: flex;
    gap: 1.5rem;
    font-size: 0.8rem;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
  }

  .stats-row .val { color: var(--text2); }
  .stats-row .correct { color: var(--green); }
  .stats-row .wrong { color: var(--red); }

  /* FLASHCARD */
  .card-scene {
    perspective: 1200px;
    width: 100%;
    max-width: 520px;
    height: var(--card-h);
    cursor: pointer;
  }

  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4,0,0.2,1);
  }

  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: var(--radius);
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .card-back {
    transform: rotateY(180deg);
    background: var(--surface2);
  }

  .card-badge {
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
    color: var(--text3);
    margin-bottom: 0.75rem;
  }

  .card-word {
    font-family: 'DM Serif Display', serif;
    font-size: 2.4rem;
    color: var(--text);
    text-align: center;
    line-height: 1.15;
  }

  .card-sub {
    font-size: 0.82rem;
    color: var(--text3);
    margin-top: 0.5rem;
    font-style: italic;
    text-align: center;
  }

  .card-ex {
    font-size: 0.82rem;
    color: var(--text2);
    margin-top: 0.75rem;
    text-align: center;
    max-width: 320px;
    line-height: 1.5;
    border-top: 1px solid var(--border);
    padding-top: 0.75rem;
  }

  .flip-hint {
    font-size: 0.75rem;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.05em;
  }

  .answer-row {
    display: flex;
    gap: 0.75rem;
  }

  .ans-btn {
    padding: 0.55rem 1.5rem;
    border-radius: var(--radius-sm);
    border: 1px solid;
    font-size: 0.85rem;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .ans-btn.correct {
    border-color: var(--green);
    color: var(--green);
    background: var(--green-light);
  }

  .ans-btn.correct:hover { background: var(--green); color: white; }

  .ans-btn.wrong {
    border-color: var(--red);
    color: var(--red);
    background: var(--red-light);
  }

  .ans-btn.wrong:hover { background: var(--red); color: white; }

  .nav-row {
    display: flex;
    gap: 0.5rem;
  }

  /* TYPING MODE */
  .typing-card {
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
  }

  .typing-prompt {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    text-align: center;
    color: var(--text);
  }

  .typing-direction {
    font-size: 0.75rem;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .type-input {
    width: 100%;
    max-width: 280px;
    padding: 0.65rem 1rem;
    border: 1.5px solid var(--border2);
    border-radius: var(--radius-sm);
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    background: var(--bg);
    color: var(--text);
    text-align: center;
    outline: none;
    transition: border-color 0.15s;
  }

  .type-input:focus { border-color: var(--accent); }
  .type-input.correct-input { border-color: var(--green); background: var(--green-light); }
  .type-input.wrong-input { border-color: var(--red); background: var(--red-light); }

  .type-feedback {
    font-size: 0.9rem;
    min-height: 1.4rem;
    font-family: 'DM Mono', monospace;
    text-align: center;
  }

  .type-feedback.correct { color: var(--green); }
  .type-feedback.wrong { color: var(--red); }

  .submit-btn {
    padding: 0.55rem 2rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--accent);
    background: var(--accent);
    color: white;
    font-size: 0.88rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }

  .submit-btn:hover { background: #b8421f; }
  .submit-btn:disabled { opacity: 0.5; cursor: default; }

  /* CONJUGATION */
  .conj-card {
    width: 100%;
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .conj-verb {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    text-align: center;
    margin-bottom: 0.25rem;
  }

  .conj-meaning {
    text-align: center;
    color: var(--text3);
    font-size: 0.85rem;
    margin-bottom: 1.5rem;
    font-style: italic;
  }

  .conj-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
  }

  .conj-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .conj-pronoun {
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    color: var(--text3);
    width: 56px;
    flex-shrink: 0;
    text-align: right;
  }

  .conj-input {
    flex: 1;
    padding: 0.45rem 0.75rem;
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    font-family: 'DM Mono', monospace;
    font-size: 0.88rem;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .conj-input:focus { border-color: var(--accent); }
  .conj-input.correct { border-color: var(--green); background: var(--green-light); color: var(--green); }
  .conj-input.wrong { border-color: var(--red); background: var(--red-light); color: var(--red); }
  .conj-input.revealed { border-color: var(--blue); background: var(--blue-light); color: var(--blue); }

  .conj-actions {
    margin-top: 1.5rem;
    display: flex;
    gap: 0.6rem;
    justify-content: center;
  }

  /* COMPLETE SCREEN */
  .complete {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }

  .complete-icon { font-size: 3rem; margin-bottom: 0.5rem; }

  .complete h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    letter-spacing: -0.02em;
  }

  .complete p { color: var(--text2); font-size: 0.9rem; }

  .score-pill {
    display: inline-block;
    padding: 0.4rem 1.25rem;
    border-radius: 100px;
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    font-weight: 500;
  }

  .hidden { display: none !important; }

  @media (max-width: 640px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .card-word { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Nederlands Leren</h1>
  <span>Dutch Study App</span>
</header>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Mode</div>
      <button class="mode-btn active" data-mode="flashcard" onclick="setMode('flashcard')">
        <span class="mode-icon">🃏</span> Flashcards
      </button>
      <button class="mode-btn" data-mode="typing" onclick="setMode('typing')">
        <span class="mode-icon">⌨️</span> Typing
      </button>
      <button class="mode-btn" data-mode="conjugation" onclick="setMode('conjugation')">
        <span class="mode-icon">📝</span> Conjugation
      </button>
    </div>

    <div class="sidebar-section" id="vocab-cats">
      <div class="sidebar-label">Vocabulary</div>
      <!-- injected by JS -->
    </div>

    <div class="sidebar-section" id="verb-cats" style="display:none;">
      <div class="sidebar-label">Verbs</div>
      <!-- injected by JS -->
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="toolbar">
      <div class="toolbar-title" id="toolbar-title">Basics</div>
      <button class="toolbar-btn" onclick="shuffle()">🔀 Shuffle</button>
      <button class="toolbar-btn" onclick="resetDeck()">↺ Restart</button>
      <button class="toolbar-btn primary" id="wrong-btn" onclick="studyWrong()" style="display:none;">Study incorrect</button>
    </div>
    <div class="progress-wrap"><div class="progress-fill" id="prog" style="width:0%"></div></div>

    <div class="study-area" id="study-area">

      <!-- FLASHCARD VIEW -->
      <div id="fc-view">
        <div class="stats-row">
          <span><span class="val" id="fc-idx">1</span> / <span id="fc-total">1</span></span>
          <span class="correct">✓ <span id="fc-correct">0</span></span>
          <span class="wrong">✗ <span id="fc-wrong">0</span></span>
        </div>

        <div class="card-scene" onclick="flipCard()">
          <div class="card" id="fc-card">
            <div class="card-face">
              <div class="card-badge" id="fc-front-label">Dutch</div>
              <div class="card-word" id="fc-front-word">—</div>
              <div class="card-sub" id="fc-front-sub"></div>
            </div>
            <div class="card-face card-back">
              <div class="card-badge" id="fc-back-label">English</div>
              <div class="card-word" id="fc-back-word"></div>
              <div class="card-ex" id="fc-back-ex"></div>
            </div>
          </div>
        </div>

        <div class="flip-hint" id="fc-hint">Click to flip</div>

        <div class="answer-row hidden" id="fc-answer-row">
          <button class="ans-btn wrong" onclick="fcAnswer(false)">✗ Incorrect</button>
          <button class="ans-btn correct" onclick="fcAnswer(true)">✓ Correct</button>
        </div>

        <div class="nav-row" id="fc-nav-row">
          <button class="toolbar-btn" onclick="fcPrev()">← Prev</button>
          <button class="toolbar-btn" onclick="flipCard()">Flip</button>
          <button class="toolbar-btn" onclick="fcNext()">Next →</button>
        </div>
      </div>

      <!-- TYPING VIEW -->
      <div id="ty-view" class="hidden">
        <div class="stats-row">
          <span><span class="val" id="ty-idx">1</span> / <span id="ty-total">1</span></span>
          <span class="correct">✓ <span id="ty-correct">0</span></span>
          <span class="wrong">✗ <span id="ty-wrong">0</span></span>
        </div>

        <div class="typing-card">
          <div class="typing-direction" id="ty-direction">Dutch → English</div>
          <div class="typing-prompt" id="ty-prompt">—</div>
          <div class="card-sub" id="ty-sub"></div>
          <input class="type-input" id="ty-input" placeholder="type your answer…" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')checkTyping()" />
          <div class="type-feedback" id="ty-feedback"></div>
          <div style="display:flex;gap:0.5rem">
            <button class="toolbar-btn" onclick="revealTyping()">Reveal</button>
            <button class="submit-btn" onclick="checkTyping()">Check →</button>
          </div>
        </div>
      </div>

      <!-- CONJUGATION VIEW -->
      <div id="cj-view" class="hidden">
        <div class="stats-row">
          <span><span class="val" id="cj-idx">1</span> / <span id="cj-total">1</span></span>
          <span class="correct">✓ <span id="cj-correct">0</span></span>
          <span class="wrong">✗ <span id="cj-wrong">0</span></span>
        </div>

        <div class="conj-card">
          <div class="conj-verb" id="cj-verb">—</div>
          <div class="conj-meaning" id="cj-meaning"></div>
          <div class="conj-grid" id="cj-grid"></div>
          <div class="conj-actions">
            <button class="toolbar-btn" onclick="checkConj()">Check</button>
            <button class="toolbar-btn" onclick="revealConj()">Reveal all</button>
            <button class="toolbar-btn primary" onclick="nextConj()">Next →</button>
          </div>
        </div>
      </div>

      <!-- COMPLETE SCREEN -->
      <div id="complete-view" class="hidden complete">
        <div class="complete-icon">🎉</div>
        <h2>Goed gedaan!</h2>
        <p id="complete-msg"></p>
        <div class="score-pill" id="complete-pill" style="background:var(--green-light);color:var(--green)"></div>
        <div style="display:flex;gap:0.75rem;margin-top:0.5rem">
          <button class="toolbar-btn" onclick="resetDeck()">Restart all</button>
          <button class="toolbar-btn primary" id="retry-wrong-btn" onclick="studyWrong()">Study incorrect</button>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
/* ===== DATA ===== */
const VOCAB = {
  basics: {
    label: "Basics",
    cards: [
      { nl:"hallo", en:"hello", ex:"Hallo! Hoe gaat het?" },
      { nl:"dankjewel", en:"thank you", ex:"Dankjewel voor de hulp!" },
      { nl:"ja", en:"yes", ex:"Ja, dat klopt." },
      { nl:"nee", en:"no", ex:"Nee, dat is niet juist." },
      { nl:"alsjeblieft", en:"please / here you go", ex:"Een koffie, alsjeblieft." },
      { nl:"sorry", en:"sorry / excuse me", ex:"Sorry, ik begrijp het niet." },
      { nl:"goedemorgen", en:"good morning", ex:"Goedemorgen! Sliep je goed?" },
      { nl:"goedemiddag", en:"good afternoon", ex:"Goedemiddag, meneer." },
      { nl:"goedenavond", en:"good evening", ex:"Goedenavond iedereen!" },
      { nl:"tot ziens", en:"goodbye", ex:"Tot ziens! Tot volgende week." },
      { nl:"tot morgen", en:"see you tomorrow", ex:"Goed gedaan! Tot morgen." },
      { nl:"hoe gaat het?", en:"how are you?", ex:"Hoi! Hoe gaat het met je?" },
      { nl:"goed", en:"good / well", ex:"Het gaat goed, dankjewel." },
      { nl:"slecht", en:"bad / badly", ex:"Het gaat niet zo slecht." },
    ]
  },
  numbers: {
    label: "Numbers",
    cards: [
      { nl:"één", en:"one" },
      { nl:"twee", en:"two" },
      { nl:"drie", en:"three" },
      { nl:"vier", en:"four" },
      { nl:"vijf", en:"five" },
      { nl:"zes", en:"six" },
      { nl:"zeven", en:"seven" },
      { nl:"acht", en:"eight" },
      { nl:"negen", en:"nine" },
      { nl:"tien", en:"ten" },
      { nl:"elf", en:"eleven" },
      { nl:"twaalf", en:"twelve" },
      { nl:"twintig", en:"twenty" },
      { nl:"dertig", en:"thirty" },
      { nl:"honderd", en:"hundred" },
      { nl:"duizend", en:"thousand" },
    ]
  },
  nouns: {
    label: "Nouns",
    cards: [
      { nl:"de kat", en:"the cat", sub:"de (common)", ex:"De kat zit op de mat." },
      { nl:"het huis", en:"the house", sub:"het (neuter)", ex:"Het huis is groot." },
      { nl:"de fiets", en:"the bicycle", sub:"de (common)", ex:"Ik rijd op de fiets." },

/* ===== STATE ===== */
let mode = 'flashcard';
let activeCat = 'basics';
let activeVerb = 'zijn';
let deck = [];
let deckIdx = 0;
let fcFlipped = false;
let fcCorrect = 0, fcWrong = 0;
let wrongCards = [];
let tyAnswered = false;
let cjCorrect = 0, cjWrong = 0;
let cjIdx = 0;
let cjDeck = [];

/* ===== SIDEBAR ===== */
function buildSidebar() {
  const vocabSection = document.getElementById('vocab-cats');
  Object.entries(VOCAB).forEach(([key, cat]) => {
    const b = document.createElement('button');
    b.className = 'cat-btn' + (key === activeCat ? ' active' : '');
    b.dataset.cat = key;
    b.innerHTML = `${cat.label} <span class="cat-count">${cat.cards.length}</span>`;
    b.onclick = () => { activeCat = key; loadVocab(); buildSidebar(); };
    vocabSection.appendChild(b);
  });

  const verbSection = document.getElementById('verb-cats');
  Object.entries(VERBS).forEach(([key, verb]) => {
    const b = document.createElement('button');
    b.className = 'cat-btn' + (key === activeVerb ? ' active' : '');
    b.dataset.verb = key;
    b.innerHTML = `<span style="font-family:'DM Mono',monospace;font-size:0.8rem">${verb.infinitive}</span>`;
    b.onclick = () => { activeVerb = key; loadConjugation(); buildSidebar(); };
    verbSection.appendChild(b);
  });
}

/* ===== MODE ===== */
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  document.getElementById('vocab-cats').style.display = m === 'conjugation' ? 'none' : '';
  document.getElementById('verb-cats').style.display = m === 'conjugation' ? '' : 'none';
  document.getElementById('fc-view').classList.toggle('hidden', m !== 'flashcard');
  document.getElementById('ty-view').classList.toggle('hidden', m !== 'typing');
  document.getElementById('cj-view').classList.toggle('hidden', m !== 'conjugation');
  document.getElementById('complete-view').classList.add('hidden');

  if (m === 'flashcard') loadVocab();
  else if (m === 'typing') loadTyping();
  else if (m === 'conjugation') loadConjugation();
}

/* ===== FLASHCARD ===== */
function loadVocab(wrongOnly) {
  const cat = VOCAB[activeCat];
  document.getElementById('toolbar-title').textContent = cat.label;
  wrongCards = wrongOnly ? wrongCards : [];
  const source = wrongOnly ? wrongCards : cat.cards;
  deck = [...source];
  deckIdx = 0; fcCorrect = 0; fcWrong = 0; wrongCards = [];
  document.getElementById('wrong-btn').style.display = 'none';
  document.getElementById('complete-view').classList.add('hidden');
  document.getElementById('fc-view').classList.remove('hidden');
  renderFC();
}

function shuffleArr(a) { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function shuffle() {
  if (mode === 'flashcard') { shuffleArr(deck); deckIdx=0; renderFC(); }
  else if (mode === 'typing') { shuffleArr(deck); deckIdx=0; renderTyping(); }
  else if (mode === 'conjugation') { shuffleArr(cjDeck); cjIdx=0; renderConj(); }
}

function resetDeck() {
  if (mode === 'flashcard') loadVocab();
  else if (mode === 'typing') loadTyping();
  else if (mode === 'conjugation') loadConjugation();
}

function studyWrong() {
  if (mode === 'flashcard') loadVocab(true);
  else if (mode === 'typing') loadTyping(true);
}

function renderFC() {
  if (deckIdx >= deck.length) { showComplete('fc'); return; }
  const c = deck[deckIdx];
  fcFlipped = false;
  document.getElementById('fc-card').classList.remove('flipped');
  document.getElementById('fc-front-word').textContent = c.nl;
  document.getElementById('fc-front-sub').textContent = c.sub || '';
  document.getElementById('fc-back-word').textContent = c.en;
  document.getElementById('fc-back-ex').textContent = c.ex || '';
  document.getElementById('fc-answer-row').classList.add('hidden');
  document.getElementById('fc-nav-row').classList.remove('hidden');
  document.getElementById('fc-hint').textContent = 'Click to flip';
  document.getElementById('fc-idx').textContent = deckIdx + 1;
  document.getElementById('fc-total').textContent = deck.length;
  document.getElementById('fc-correct').textContent = fcCorrect;
  document.getElementById('fc-wrong').textContent = fcWrong;
  document.getElementById('prog').style.width = Math.round(deckIdx / deck.length * 100) + '%';
}

function flipCard() {
  if (deckIdx >= deck.length) return;
  fcFlipped = !fcFlipped;
  document.getElementById('fc-card').classList.toggle('flipped', fcFlipped);
  if (fcFlipped) {
    document.getElementById('fc-answer-row').classList.remove('hidden');
    document.getElementById('fc-nav-row').classList.add('hidden');
    document.getElementById('fc-hint').textContent = 'Did you get it right?';
  } else {
    document.getElementById('fc-answer-row').classList.add('hidden');
    document.getElementById('fc-nav-row').classList.remove('hidden');
    document.getElementById('fc-hint').textContent = 'Click to flip';
  }
}

function fcAnswer(ok) {
  if (ok) fcCorrect++; else { fcWrong++; wrongCards.push(deck[deckIdx]); }
  deckIdx++;
  renderFC();
}

function fcNext() { deckIdx = Math.min(deckIdx + 1, deck.length); renderFC(); }
function fcPrev() { deckIdx = Math.max(deckIdx - 1, 0); renderFC(); }

/* ===== TYPING ===== */
function loadTyping(wrongOnly) {
  const cat = VOCAB[activeCat];
  document.getElementById('toolbar-title').textContent = cat.label;
  const source = wrongOnly ? wrongCards : cat.cards;
  deck = [...source];
  deckIdx = 0; fcCorrect = 0; fcWrong = 0; wrongCards = [];
  document.getElementById('wrong-btn').style.display = 'none';
  document.getElementById('complete-view').classList.add('hidden');
  document.getElementById('ty-view').classList.remove('hidden');
  renderTyping();
}

function renderTyping() {
  if (deckIdx >= deck.length) { showComplete('ty'); return; }
  const c = deck[deckIdx];
  tyAnswered = false;
  document.getElementById('ty-prompt').textContent = c.nl;
  document.getElementById('ty-sub').textContent = c.sub || '';
  document.getElementById('ty-direction').textContent = 'Dutch → English';
  const inp = document.getElementById('ty-input');
  inp.value = '';
  inp.className = 'type-input';
  inp.disabled = false;
  inp.placeholder = 'type your answer…';
  inp.focus();
  document.getElementById('ty-feedback').textContent = '';
  document.getElementById('ty-feedback').className = 'type-feedback';
  document.getElementById('ty-idx').textContent = deckIdx + 1;
  document.getElementById('ty-total').textContent = deck.length;
  document.getElementById('ty-correct').textContent = fcCorrect;
  document.getElementById('ty-wrong').textContent = fcWrong;
  document.getElementById('prog').style.width = Math.round(deckIdx / deck.length * 100) + '%';
}

function normalize(s) { return s.trim().toLowerCase().replace(/[^a-záàäéèëíìïóòöúùü\/\- ]/gi,''); }

function checkTyping() {
  if (tyAnswered) { deckIdx++; renderTyping(); return; }
  const c = deck[deckIdx];
  const inp = document.getElementById('ty-input');
  const answers = c.en.split('/').map(a => normalize(a));
  const given = normalize(inp.value);
  const fb = document.getElementById('ty-feedback');
  if (!given) return;

  const ok = answers.some(a => given === a || given === a.trim());
  tyAnswered = true;
  if (ok) {
    fcCorrect++;
    inp.className = 'type-input correct-input';
    fb.textContent = '✓ Correct!';
    fb.className = 'type-feedback correct';
  } else {
    fcWrong++;
    wrongCards.push(c);
    inp.className = 'type-input wrong-input';
    fb.textContent = '✗  Answer: ' + c.en;
    fb.className = 'type-feedback wrong';
  }
  inp.disabled = true;
  document.getElementById('ty-correct').textContent = fcCorrect;
  document.getElementById('ty-wrong').textContent = fcWrong;
}

function revealTyping() {
  const c = deck[deckIdx];
  const inp = document.getElementById('ty-input');
  inp.value = c.en;
  inp.className = 'type-input revealed';
  inp.disabled = true;
  const fb = document.getElementById('ty-feedback');
  fb.textContent = c.ex ? '"' + c.ex + '"' : '';
  fb.className = 'type-feedback';
  fcWrong++;
  wrongCards.push(c);
  document.getElementById('ty-wrong').textContent = fcWrong;
  tyAnswered = true;
}

/* ===== CONJUGATION ===== */
function loadConjugation() {
  const verb = VERBS[activeVerb];
  document.getElementById('toolbar-title').textContent = verb.infinitive;
  cjDeck = Object.keys(VERBS);
  cjIdx = cjDeck.indexOf(activeVerb);
  cjCorrect = 0; cjWrong = 0;
  document.getElementById('complete-view').classList.add('hidden');
  document.getElementById('cj-view').classList.remove('hidden');
  renderConj();
}

function renderConj() {
  const key = cjDeck[cjIdx];
  const verb = VERBS[key];
  activeVerb = key;
  document.getElementById('cj-verb').textContent = verb.infinitive;
  document.getElementById('cj-meaning').textContent = verb.meaning;
  document.getElementById('cj-idx').textContent = cjIdx + 1;
  document.getElementById('cj-total').textContent = cjDeck.length;
  document.getElementById('cj-correct').textContent = cjCorrect;
  document.getElementById('cj-wrong').textContent = cjWrong;
  document.getElementById('prog').style.width = Math.round(cjIdx / cjDeck.length * 100) + '%';

  const grid = document.getElementById('cj-grid');
  grid.innerHTML = '';
  verb.forms.forEach((f, i) => {
    const row = document.createElement('div');
    row.className = 'conj-row';
    row.innerHTML = `<span class="conj-pronoun">${f.pronoun}</span><input class="conj-input" data-idx="${i}" placeholder="…" autocomplete="off" spellcheck="false">`;
    grid.appendChild(row);
  });
  grid.querySelectorAll('.conj-input')[0]?.focus();
}

function checkConj() {
  const key = cjDeck[cjIdx];
  const verb = VERBS[key];
  const inputs = document.querySelectorAll('.conj-input');
  let allOk = true;
  inputs.forEach((inp, i) => {
    const correct = verb.forms[i].form;
    const given = inp.value.trim().toLowerCase();
    if (given === correct) {
      inp.className = 'conj-input correct';
    } else {
      inp.className = 'conj-input wrong';
      allOk = false;
    }
  });
  if (allOk) cjCorrect++; else cjWrong++;
  document.getElementById('cj-correct').textContent = cjCorrect;
  document.getElementById('cj-wrong').textContent = cjWrong;
}

function revealConj() {
  const key = cjDeck[cjIdx];
  const verb = VERBS[key];
  document.querySelectorAll('.conj-input').forEach((inp, i) => {
    inp.value = verb.forms[i].form;
    inp.className = 'conj-input revealed';
    inp.disabled = true;
  });
}

function nextConj() {
  cjIdx++;
  if (cjIdx >= cjDeck.length) {
    showComplete('cj');
  } else {
    renderConj();
    buildSidebar();
  }
}

/* ===== COMPLETE ===== */
function showComplete(src) {
  const total = src === 'cj' ? cjDeck.length : deck.length;
  const corr = src === 'cj' ? cjCorrect : fcCorrect;
  const wrng = src === 'cj' ? cjWrong : fcWrong;
  document.getElementById('fc-view').classList.add('hidden');
  document.getElementById('ty-view').classList.add('hidden');
  document.getElementById('cj-view').classList.add('hidden');
  document.getElementById('complete-view').classList.remove('hidden');
  document.getElementById('prog').style.width = '100%';

  const pct = total > 0 ? Math.round(corr / total * 100) : 0;
  document.getElementById('complete-msg').textContent = `${corr} correct out of ${total} — ${pct}%`;
  const pill = document.getElementById('complete-pill');
  pill.textContent = pct >= 90 ? '🌟 Uitstekend!' : pct >= 70 ? '👍 Goed gedaan!' : pct >= 50 ? '💪 Ga door!' : '📚 Blijf oefenen!';
  pill.style.background = pct >= 70 ? 'var(--green-light)' : 'var(--accent-light)';
  pill.style.color = pct >= 70 ? 'var(--green)' : 'var(--accent)';

  const retryBtn = document.getElementById('retry-wrong-btn');
  retryBtn.style.display = (src !== 'cj' && wrongCards.length > 0) ? '' : 'none';
  document.getElementById('wrong-btn').style.display = (src !== 'cj' && wrongCards.length > 0) ? '' : 'none';
}

/* ===== INIT ===== */
buildSidebar();
loadVocab();
</script>
